services:
  db:
    image: pgvector/pgvector:pg16
    container_name: corporate_platform_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: corporate_platform
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d corporate_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: corporate_platform_backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/corporate_platform
    depends_on:
      db:
        condition: service_healthy

networks:
  default:
    name: corporate_platform_network
